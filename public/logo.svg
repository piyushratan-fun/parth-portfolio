<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <!-- Container / Background -->
  <defs>
    <linearGradient id="pk_accent_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B4FFF"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="pk_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brand Mark Icon Box -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="14" fill="#0a0a0a"/>
    <rect x="0.75" y="0.75" width="58.5" height="58.5" rx="13.25" stroke="url(#pk_accent_grad)" stroke-width="1.5" stroke-opacity="0.8"/>
    
    <!-- Stylized PK Vector Mark -->
    <!-- Letter P -->
    <path d="M18 44V16H27C31.5 16 35 19.5 35 24C35 28.5 31.5 32 27 32H23.5V44H18ZM23.5 27H26.5C28.5 27 30 25.5 30 24C30 22.5 28.5 21 26.5 21H23.5V27Z" fill="#ffffff"/>
    
    <!-- Letter K / Science Helix Arm -->
    <path d="M34 44L41.5 33.5L34.5 24H40.5L44.5 29.5L48.5 24H54.5L47.5 33.5L55 44H48.8L44.5 37.5L40.2 44H34Z" fill="url(#pk_accent_grad)"/>
    
    <!-- Bio / Physics Pulse Nodes -->
    <circle cx="48" cy="18" r="3" fill="#10b981" filter="url(#pk_glow)"/>
    <circle cx="15" cy="42" r="2.5" fill="#2B4FFF"/>
  </g>

  <!-- Typographic Wordmark -->
  <g transform="translate(84, 25)">
    <!-- Main Name -->
    <text x="0" y="20" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0a0a0a" letter-spacing="-0.5">
      PARTH <tspan fill="#2B4FFF">KASHYAP</tspan>
    </text>
    
    <!-- Subtitle / Stream -->
    <text x="1" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="2.8">
      PCB STREAM • PRE-MED & SCIENCE
    </text>
  </g>
</svg>
